name: Generate Snake Animation

on:
  schedule:
    # هر ۲۴ ساعت یک‌بار به‌طور خودکار اجرا می‌شود
    - cron: "0 0 * * *"
  
  # امکان اجرای دستی از تب Actions
  workflow_dispatch:
  
  # با هر پوش روی برنچ اصلی اجرا می‌شود
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ساخت انیمیشن مار از روی Contribution Graph گیت‌هاب
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # انتقال فایل ساخته‌شده به برنچ مجزای output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
